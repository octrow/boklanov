slug: the-blue-bird
identity:
  title:
    ru: Синяя птица
    en: The Blue Bird
    de: Der Blaue Vogel
  synopsis:
    ru:
      История о волшебном путешествии брата и сестры Тильтиль и Митиль за сказочной Синей птицей — второй спектакль
      гуманистической трилогии Руслана Кудашова с участием 57 кукол разного формата.
    en:
      The story of the magical journey of brother and sister Tiltil and Mytil in search of the Blue Bird — the second
      performance in Ruslan Kudashov's humanistic trilogy, featuring 57 puppets of various formats.
    de:
      Die Geschichte der magischen Reise von Bruder und Schwester Tiltil und Mytil auf der Suche nach dem Blauen Vogel —
      die zweite Aufführung in Ruslan Kudashows humanistischer Trilogie mit 57 Puppen verschiedener Formate.
