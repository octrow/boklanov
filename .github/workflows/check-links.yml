name: Check links

# Quarterly dead-link check of boklanov.com (scripts/check-links.sh). Dead
# links fail the run, which GitHub mails to whoever last edited this
# schedule (issues are disabled on the repo); the list is in the run
# summary. Fix flow: scripts/fix-dead-links.ts (Wayback snapshots) via an
# ops/ script, as in ops/2026-10-09-fix-dead-links.sh.

on:
  schedule:
    - cron: '0 6 1 1,4,7,10 *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check
        run: |
          status=0
          bash scripts/check-links.sh > report.txt || status=$?
          if [ "$status" -ne 0 ]; then
            {
              echo "### $(wc -l < report.txt) dead link(s) on boklanov.com"
              echo 'Code and URL; `000` = no answer.'
              echo '```'
              cat report.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No dead links." >> "$GITHUB_STEP_SUMMARY"
          fi
          cat report.txt
          exit "$status"
