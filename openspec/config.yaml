schema: spec-driven

context: |
  Portfolio site of theatre director Roman Boklanov (productions, bio, press), RU/EN/DE.
  Stack: Next.js App Router + next-intl (localePrefix as-needed, default en), deployed on Vercel.
  Production branch `main`: content in content/productions/*.yaml edited via Keystatic Cloud
  (commits by keystatic-cloud[bot] trigger prod deploys). Branch `feature/payloadcms`: content
  moves to Payload 3 + PostgreSQL. Media lives in Cloudflare R2 behind cdn.boklanov.com;
  public/productions is a git backup of R2 (backup-r2-to-git workflow), not a serving path.
  Domain glossary: CONTEXT.md (Saved vs Published, Content delta, Cutover).
  Conventional commits (`<type>: <description>`).

