identity:
  title:
    ru: Щедрое дерево
    en: The Giving Tree
    de: Der großzügige Baum
  synopsis:
    ru:
      История о дереве, которое отдавало мальчику всё — от яблок до своего ствола. Спектакль о щедрости, любви и цене,
      которую мы платим за привязанность.
    en:
      A story about a tree that gave a boy everything it had. A performance about generosity, love, and the price of
      attachment.
    de:
      Eine Geschichte über einen Baum, der einem Jungen alles gab, was er hatte. Eine Aufführung über Großzügigkeit, Liebe
      und den Preis der Bindung.
