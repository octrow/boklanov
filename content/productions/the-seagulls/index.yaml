title:
  ru: Чайки
  en: The Seagulls
  de: Die Möwen
synopsis:
  ru: Учебная работа студентов режиссёрского курса Руслана Кудашова — динамичный спектакль по мотивам комедии Чехова, смонтированный из этюдов, визуальных метафор и современных ритмов.
  en: "A student work from Ruslan Kudashov's directing course — a dynamic piece based on Chekhov's comedy, assembled from sketches, visual metaphors and contemporary rhythms."
  de: Eine Studienarbeit aus Ruslan Kudashows Regiestudiengang — ein dynamisches Stück nach Tschechows Komödie, aus Etüden, visuellen Metaphern und zeitgenössischen Rhythmen zusammengesetzt.
