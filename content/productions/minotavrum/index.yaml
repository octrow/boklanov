  ru: Минотаврум
  en: Minotavrum
  de: Minotavrum
synopsis:
  ru: Спектакль по мотивам древнегреческого мифа. Лабиринт, герой и чудовище —
    история об испытании, где граница между победителем и жертвой размыта. Роман
    Бокланов — в роли Тесея.
  en: A performance inspired by the ancient Greek myth. A labyrinth, a hero, and a
    monster — a story of a trial where the line between victor and victim is
    blurred. Roman Boklanov as Theseus.
  de: Eine Aufführung nach dem altgriechischen Mythos. Ein Labyrinth, ein Held und
    ein Monster — eine Geschichte über eine Prüfung, in der die Grenze zwischen
    Sieger und Opfer verschwimmt. Roman Boklanov als Theseus.
