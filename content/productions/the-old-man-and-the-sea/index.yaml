title:
  ru: Старик и море
  en: The Old Man and the Sea
  de: Der alte Mann und das Meer
synopsis:
  ru: Nachdem er den Wunderfish verloren hat, ohne Ruder und Harpune, nachdem er
    eine vernichtende Niederlage erlitten hat, fand der alte Mann etwas sehr
    Wichtiges auf dieser Reise, sagt Regisseur Rinat Kiyakov über das Stück.
  en: Having lost the miracle fish, left without oars and harpoon, having suffered
    a crushing defeat, the Old Man found something very important in this
    journey, director Rinat Kiyakov says about the play.
  de: Nachdem er den Wunderfish verloren hat, ohne Ruder und Harpune, nachdem er
    eine vernichtende Niederlage erlitten hat, fand der alte Mann etwas sehr
    Wichtiges auf dieser Reise, sagt Regisseur Rinat Kiyakov über das Stück.
