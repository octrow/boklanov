title:
  ru: Похороните меня за плинтусом
  en: Bury Me Behind the Baseboard
  de: Begraben Sie mich hinter der Fußleiste
synopsis:
  ru: Светлый разговор о одиночестве, сложном и непонятном взрослом мире, который выстроили вокруг героя близкие. На сцене БТК, режиссёр Роман Бокланов
  en: Is a lighthearted talk about loneliness and the complicated and incomprehensible adult world that those close to him have built around it. Performed onstage at the BTK, directed by Roman Boklanov
  de: Ein leichtherziger Vortrag über Einsamkeit und die komplizierte und unverständliche Erwachsenenwelt, die diejenigen um ihn herum aufgebaut haben. Auf der Bühne des BTK, unter der Regie von Roman Boklanov aufgeführt
directorsNote:
  ru: Бабушка была моей жизнью, мама — редким праздником. У праздника были свои правила, у жизни свои.
  en: Grandma was my life, my mother was a rare holiday. The holiday had its own rules, life had its own rules.
  de: Großmutter war mein Leben, Mutter war ein seltener Feiertag. Der Feiertag hatte seine eigenen Regeln, das Leben hatte seine eigenen.
tagline:
  ru: Автобиографичный спектакль-воспоминание
  en: An autobiographical play-memory
  de: Ein autobiographisches Spiel-Gedächtnis
