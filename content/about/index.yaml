        ru: Родился в Усть-Каменогорске, Казахстан
        en: Born in Ust-Kamenogorsk, Kazakhstan
        de: Geboren in Ust-Kamenogorsk, Kasachstan
    - year: 2017
      label:
        ru: Артист спектакля-лауреата «Золотой маски» («Старый дом», Новосибирск)
        en: Performer in Golden Mask laureate production (Stary Dom, Novosibirsk)
        de: >-
          Darsteller der mit der «Goldenen Maske» ausgezeichneten Aufführung
          («Altes Haus», Nowosibirsk)
    - year: 2018
      label:
        ru: >-
          Гран-при международного фестиваля театральных школ Istropolitana
