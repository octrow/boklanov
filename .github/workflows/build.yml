name: Build

on: [push, pull_request]

permissions:
  contents: read

jobs:
  Build:
    runs-on: ubuntu-latest

    # Throwaway Postgres for Payload: the build prerenders pages through
    # Payload, so it needs a reachable DB with the current schema. Migrations
    # create that schema from scratch, which also proves they apply cleanly.
    # Never points at Neon — CI must not touch production data.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:ci@localhost:5432/postgres
      DATABASE_URL_UNPOOLED: postgresql://postgres:ci@localhost:5432/postgres
      PAYLOAD_SECRET: ci-only-not-a-secret

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: migrate
        run: npm run payload -- migrate
      - name: build
        run: npm run build
