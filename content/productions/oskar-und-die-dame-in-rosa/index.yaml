identity:
  title:
    ru: Оскар и Розовая дама
    en: Oskar und die Dame in Rosa
    de: Oskar und die Dame in Rosa
  tagline: {}
  synopsis:
    ru: >-
      Спектакль для семейного просмотра в жанре фигуративного театра учит
      принимать жизнь во всех её проявлениях и ценить каждую секунду. Предложив
      Оскару сыграть в игру, согласно которой каждый прожитый им день будет
      считаться за десять лет, Розовая дама помогает мальчику за двенадцать дней
      прожить целую жизнь.
    en: >-
      A play for the whole family in the genre of figurative theater that
      teaches to embrace life in all its forms and appreciate every second.
    de: >-
      Ein Theaterstück für die ganze Familie im Genre des figurativen Theaters,
      das lehrt, das Leben in all seinen Formen anzunehmen und jede Sekunde zu
      schätzen.
  directorsNote:
    ru: ''
    en: ''
    de: ''
