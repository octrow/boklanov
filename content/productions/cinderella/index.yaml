title:
  ru: Золушка
  en: Cinderella
  de: Aschenputtel
synopsis:
  ru: Где-то в глубинах старого дома играющие дети находят забытых кукол, оживляют их, и, проживая вместе с ними жизнь сказочных персонажей, ищут ответы на главные вопросы жизни.
  en: "Experience the magic of Cinderella in a captivating puppet show. Discover the power of love, strength of spirit, and faith in the best. Suitable for ages 4+. Get your tickets now!"
  de: "Erleben Sie die Magie von Aschenputtel in einem fesselnden Puppenspiel. Entdecken Sie die Kraft der Liebe, die Stärke des Geistes und den Glauben an das Beste. Geeignet für Kinder ab 4 Jahren. Holen Sie sich jetzt Ihre Karten!"
directorsNote:
  ru: Моё милое дитя, будь доброй и ласковой, и господь тебе всегда поможет, а я буду глядеть на тебя с неба и всегда буду возле тебя
  en: My dear child, be kind and gentle, and the Lord will always help you, and I will look at you from heaven and will always be near you
  de: Mein liebes Kind, sei gütig und sanft, und der Herr wird dir immer helfen, und ich werde dich vom Himmel aus anschauen und werde immer bei dir sein
