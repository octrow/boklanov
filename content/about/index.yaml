        en: >-
          Grand Prix at the Istropolitana Project international theatre-school
          festival, Bratislava
        de: >-
          Grand Prix des internationalen Festivals der Theaterschulen
          Istropolitana Project, Bratislava
    - year: 2020
      label:
        ru: Премьера «Похороните меня за плинтусом», БТК (Санкт-Петербург)
        en: Premiere of Bury Me Behind the Baseboard at BTK (Saint Petersburg)
        de: >-
          Premiere von „Begrabt mich hinter der Sockelleiste“, GBT (Sankt
          Petersburg)
    - year: 2021
      label:
        ru: >-
          Окончил РГИСИ — режиссёр театра кукол, мастерская Р.Р. Кудашова (курс
