title:
  ru: Меня удочерила Горилла
  en: The Ape Star
  de: Der Affenstern
synopsis:
  ru: Cемейная рок-история для тех, кто не вписывается в рамки. Девятилетнюю
    девочку Юнну удочерила огромная черная горилла - с мохнатыми лапами и
    кривыми зубами. И что теперь делать девочке?
  en: "Family rock story for those who don't fit in. A nine-year-old girl, Yunna,
    is adopted by a huge black gorilla - with shaggy paws and crooked teeth.
    What is the girl to do now?"
  de: Familien-Rock-Geschichte für diejenigen, die nicht passen. Ein neunjähriges
    Mädchen namens Yunna wird von einem großen schwarzen Gorilla mit zotteligem
    Fell und schiefen Zähnen adoptiert. Was soll das Mädchen nun tun?
directorsNote:
  ru: "Давай... давай откроем книжный киоск на колёсах и отправимся к океану, как
    мы и мечтали!!! Я совсем не хочу оставаться в приюте. Я хочу быть с тобой…
    Мама!"
  en: "Let's... let's open a bookstore on wheels and go to the ocean like we
    dreamed of!!! I don't want to stay at the shelter at all. I want to be with
    you…Mom!"
  de: "Lass uns... lass uns einen Bücherladen auf Rädern eröffnen und zum Ozean
    gehen, wie wir träumten!!! Ich will überhaupt nicht im Asyl bleiben. Ich
    will bei dir sein... Mutter!"
tagline:
  ru: Рок-история для тех, кто не вписывается в рамки
  en: "Rock-history for those who don't fit the mould"
  de: Rock-Geschichte für diejenigen, die nicht in die Schablone passen
