schema: spec-driven

context: |
  Portfolio site of theatre director Roman Boklanov (productions, bio, awards, press, contact), RU/EN/DE.
  Users and decisions: PRODUCT.md (primary user: EU curator on a phone, ~90 s). Glossary: CONTEXT.md.
  Stack: Next.js 15 App Router + next-intl (locales en default without prefix, /de, /ru; localePrefix as-needed),
  Payload 3 CMS (admin at /admin) on Neon Postgres, media on Cloudflare R2. Deployed on Vercel
  (project boklanovs-projects/boklanov_v2); prod = branch main, Neon branch per Vercel env.
  Content lives only in the Payload DB; admin saves publish within seconds (no drafts, no deploy).
  Local DB: docker pg17 on :5433. Never touch the prod DB directly: prod commands go into
  ops/<date>-<task>.sh (read .env via dotenv, backup, dry run, confirm, apply, revalidate).
  Design system: DESIGN.md (v3 Plakat) + tokens in app/globals.css. Design review log:
  .design/boklanov-rewrite/DESIGN_REVIEW_CHANGELOG.md.
  Solo project: commit straight to main, conventional commits (`<type>: <description>`),
  verify on boklanov.com after the Vercel deploy.

rules:
  tasks:
    - Each task states how to verify it (command, Playwright check, or observable behaviour on a named page)
    - The last task ships it - lint, build, commit to main, verify on boklanov.com, add a DESIGN_REVIEW_CHANGELOG.md entry
