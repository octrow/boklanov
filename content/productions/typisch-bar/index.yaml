title:
  ru: Медведь в своём репертуаре
  en: Typisch bär
  de: Typischer Bär
synopsis:
  ru: В самом-самом обыкновенном лесу, среди самых-самых обыкновенных зверей живет
    не вполне обыкновенный Медведь. Что же с ним не так?
  en: "In a very ordinary forest, among very ordinary animals, lives a not quite
    ordinary Bear. What's wrong with him?"
  de: In einem sehr gewöhnlichen Wald lebt unter sehr gewöhnlichen Tieren ein
    nicht ganz gewöhnlicher Bär. Was stimmt nicht mit ihm?
tagline:
  ru: История для «не таких как все»
  en: "A story for those who don't fit in"
  de: Eine Geschichte für diejenigen, die nicht passen
directorsNote:
  ru: "Не тот велик, кто никогда не падал, а тот велик — кто падал и вставал!
    Конфуций между прочим!"
  en: "Great is not the one who never fell, but great is the one who fell and got
    up! Confucius by the way!"
  de: "Großartig ist nicht derjenige, der nie gefallen ist, sondern großartig ist
    derjenige, der fiel und aufstand! Konfuzius übrigens!"
