# Lineage — for the recommends algorithm (brief D9). Pick from:
#   btk | rgisi | kudashov | dotheatre | ...
# Auto-detect filled: []
lineage: []

# Director / co-director / performer / reader / sketch
# Auto-detect filled: director
role: director

# Age rating: 0+ | 3+ | 6+ | 12+ | 16+ | 18+ (auto: 4+)
