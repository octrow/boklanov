slug: holiday-recipe
identity:
  title:
    ru: Рецепт праздника
    en: Holiday recipe
    de: Feierrezept
  tagline:
    ru: Новогодняя интерактивная сказка для семейного просмотра
    en: New Year interactive tale for family viewing
    de: Neujahrs-Interaktives Märchen für Familie
  synopsis:
    ru:
      Жители лесной деревни ещё никогда не обходились без их традиционного лакомства. Но в этот раз в канун праздника все
      пироги таинственно исчезают. Неужели пропажа испортит всем жителям деревни праздник и Новый год не наступит? Или
      найдется герой, который вернёт всем не только праздник, но и что-то более важное?
    en:
      A forest village is bustling with activity. The inhabitants are preparing for the New Year and waiting for the
      traditional holiday cake. After all, what is a New Year without a New Year's treat? But this time the holiday may
      not come! On New Year's Eve, all the pies mysteriously disappear.
    de:
      Ein Walddorf ist voller Aktivität. Die Bewohner bereiten sich auf das Neujahr vor und warten auf den traditionellen
      Festkuchen. Schließlich, was ist Neujahr ohne Neujahrsgeschenk? Aber dieses Mal könnte der Feiertag nicht kommen!
      In der Silvesternaacht verschwinden alle Kuchen auf mysteriöse Weise.
