title:
  ru: Лина-Марлина
  en: Lina-Marlina
  de: Lina-Marlina
synopsis:
  ru: В подводном городе рождается русалка, одаренная прекрасным голосом и необычными синими волосами. Став подростком, она решает воплотить мечту — петь свои песни. Но родители, боясь за безопасность любимой дочери, заставляют ее гасить свою яркую индивидуальность.
  en: "In an underwater town, a mermaid with a beautiful voice and unusual blue hair is born. As she grows up, she dreams of singing her own songs. However, her parents, who love her dearly, want to protect her from the dangers of the world and make her suppress her vibrant personality. The mermaid decides to leave her home and ventures into the dark waters where monsters lurk… This play-concert explores the themes of self-discovery and finding one's calling, friendship beyond stereotypes, the generational gap between parents and children, and the inner conflict between light and darkness."
  de: In einer Unterwasserstadt wird eine Meerjungfrau mit wunderschöner Stimme und ungewöhnlichen blauen Haaren geboren. Als sie aufwächst, träumt sie davon, ihre eigenen Lieder zu singen. Aber ihre Eltern, die sie über alles lieben, wollen sie vor den Gefahren der Welt schützen und zwingen sie, ihre lebendige Persönlichkeit zu unterdrücken. Die Meerjungfrau beschließt, ihr Zuhause zu verlassen und wagt sich in die dunklen Gewässer, in denen Monster lauern… Dieses Spielkonzert erforscht die Themen Selbstentdeckung und Berufung, Freundschaft jenseits von Stereotypen, die Generationskluft zwischen Eltern und Kindern und den inneren Konflikt zwischen Licht und Dunkelheit.
