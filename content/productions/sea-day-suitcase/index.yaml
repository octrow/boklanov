slug: sea-day-suitcase
identity:
  title:
    ru: Чемодан для моря
    en: Suitcase for the sea
    de: Koffer für das Meer
  tagline:
    ru: Спектакль для тех, кто перестал мечтать
    en: A play for those who stopped dreaming
    de: Ein Spiel für diejenigen, die aufgehört haben zu träumen
  synopsis:
    ru:
      Удивительный и трогательный спектакль с соленым запахом моря и шумом прибоя в ракушке. А еще с песней под гитару. И
      рыжим котом!
    en:
      An amazing and touching performance with the salty smell of the sea and the sound of the surf in a seashell. And
      also with a guitar song. And a ginger cat!
    de:
      Ein erstaunliches und ergreifendes Schauspiel mit salzigem Meergeruch und dem Rauschen der Brandung in einer
      Muschel. Und auch mit einem Gitarrenlied. Und eine rote Katze!
  directorsNote:
    ru:
      Твою мечту, уснувшую на антресолях, совсем загрызла моль, проела такую огромную плешь, что ты рискуешь забыть о
      своей мечте!
    en:
      Your dream, which has been sleeping on the windowsills, has been eaten by mold, making such a huge hole that you
      risk forgetting your dream!
    de:
      Dein Traum, der auf den Regalen schlief, wurde von Motten gefressen, ein so großes Loch gefressen, dass du Gefahr
      läufst, deinen Traum zu vergessen!
