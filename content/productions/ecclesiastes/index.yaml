  en: Ecclesiastes
  de: Kohelet
synopsis:
  ru: Пластическая импровизация на тему книги Ветхого Завета, авторство которой приписывается царю Соломону. Минимум декораций и слов, игровое пространство усыпано песком — за основу взят образный язык танца.
  en: A plastic improvisation on the theme of the Old Testament book attributed to King Solomon. Minimum of scenery and words — the playing space is strewn with sand, and the figurative language of dance is at its core.
  de: Eine plastische Improvisation zum Thema des alttestamentlichen Buches, das König Salomon zugeschrieben wird. Ein Minimum an Bühnenbild und Worten — der Spielraum ist mit Sand bestreut und die bildhafte Sprache des Tanzes steht im Mittelpunkt.
