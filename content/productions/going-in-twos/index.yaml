title:
  ru: Идём вдвоём
  en: Going in twos
  de: Gemeinsam unterwegs
synopsis:
  ru: Трогательная история о настоящей дружбе Бельчонка и Медвежонка будет проходить внутри большого шатра, в котором разместятся большие и маленькие зрители.
  en: The touching story of a true friendship between Squirrel and Bear will take place inside a large marquee, with large and small audiences.
  de: Die ergreifende Geschichte von echter Freundschaft zwischen Eichhörnchen und Bär wird in einem großen Zelt für große und kleine Zuschauer stattfinden.
directorsNote:
  ru: Мама, папа, приходите скорей, вместе нам будет жить веселей…
  en: Mom, Dad, come soon, together we will live more happily…
  de: Mama, Papa, kommt bald, zusammen werden wir froher leben…
tagline:
  ru: Путешествие навстречу дружбе
  en: Journey towards friendship
  de: Reise auf der Suche nach Freundschaft
