name: Sync media to R2

on:
  push:
    branches: [main]
    paths:
      - 'public/productions/**'
      - 'public/about/**'
  workflow_dispatch: {} # Allow manual re-sync from the Actions tab

# Avoid two pushes racing on the same paths.
concurrency:
  group: r2-sync
  cancel-in-progress: false

env:
  # R2_BUCKET secret is optional — falls back to the default bucket name
  # used by scripts/upload-images.ts so a missing secret doesn't break sync.
  R2_BUCKET: ${{ secrets.R2_BUCKET || 'boklanov-content' }}
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: auto
  R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify required secrets
        run: |
          : "${AWS_ACCESS_KEY_ID:?R2_ACCESS_KEY_ID secret is missing}"
          : "${AWS_SECRET_ACCESS_KEY:?R2_SECRET_ACCESS_KEY secret is missing}"
          if [ "$R2_ENDPOINT" = "https://.r2.cloudflarestorage.com" ]; then
            echo "::error::R2_ACCOUNT_ID secret is missing"
            exit 1
          fi
          echo "Bucket: $R2_BUCKET"
          echo "Endpoint: $R2_ENDPOINT"

      # --exclude 'lqip.json' / 'lqip.*': these are build-time blur-placeholder
      # metadata read from disk by lib/content.ts; never fetched over the
      # network. No reason to ship them to R2.
      #
      # No --delete: R2 may contain historical assets that were uploaded
      # manually before this workflow existed and aren't in the repo. We
      # additively sync; orphan cleanup is a separate manual step (use the
      # workflow_dispatch trigger with a one-off --delete run if desired).
      - name: Sync productions/
        run: |
          aws s3 sync public/productions/ \
            "s3://${R2_BUCKET}/productions/" \
            --endpoint-url "${R2_ENDPOINT}" \
            --exclude '*.json' \
            --size-only

      - name: Sync about/
        run: |
          if [ -d public/about ]; then
            aws s3 sync public/about/ \
              "s3://${R2_BUCKET}/about/" \
              --endpoint-url "${R2_ENDPOINT}" \
              --exclude '*.json' \
              --size-only
          fi
