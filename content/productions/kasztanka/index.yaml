  de: Kastanka
synopsis:
  ru: Каштанка нашла нового хозяина — клоуна цирка. Новая жизнь поманила её теплом и едой. Но однажды из зрительного зала донёсся знакомый голос…
  en: Kashtanka found a new owner — a circus clown. A new life beckoned with warmth and food. But one day a familiar voice came from the audience…
  de: Kastanka hat einen neuen Besitzer gefunden – einen Zirkusclown. Das neue Leben lockte sie mit Wärme und Essen. Aber eines Tages kam eine vertraute Stimme aus dem Publikum…
