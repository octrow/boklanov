identity:
  title:
    ru: Онлайн
    en: Online
    de: Online
  synopsis:
    ru:
      Документальный спектакль для подростков о жизни в интернете. Основан на реальных событиях, интервью и открытых
      материалах сети.
    en:
      Experience the real-life story of the Internet with ONLINE. Directed by Roman Boklanov and based on interviews and
      real events. Don't miss out!
    de:
      Ein dokumentarisches Stück für Teenager über das Leben im Internet. Basierend auf echten Ereignissen, Interviews und
      offenen Netzwerkmaterialien.
