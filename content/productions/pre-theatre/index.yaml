slug: pre-theatre
identity:
  title:
    ru: ДОТЕАТР
    en: DOTHEATRE
    de: DOTHEATRE
  tagline:
    ru: Спектакль — прогулка
    en: Performance — walk
    de: Aufführung — Spaziergang
  synopsis:
    ru:
      Реконструкция событий, которые были возле Александринского театра. Вы увидите, как создавался ландшафт, какими он
      наполнялся звуками и голосами, природными и человеческими.
    en:
      A reconstruction of the events that took place outside the Alexandrinsky Theatre. You will see how the landscape was
      created, how it was filled with sounds and voices, natural and human.
    de:
      Eine Rekonstruktion der Ereignisse, die außerhalb des Alexandrinsky-Theaters stattfanden. Sie werden sehen, wie die
      Landschaft geschaffen wurde und wie sie mit Klängen und Stimmen, natürlichen und menschlichen, gefüllt wurde.
