slug: wee-little-havroshechka
identity:
  title:
    ru: Крошечка-Хаврошечка
    en: Wee Little Havroshechka
    de: Kleine Havroshechka
  tagline:
    ru: Посвящается нашим прародителям
    en: Dedicated to our ancestors
    de: Unseren Vorfahren gewidmet
  synopsis:
    ru:
      Трудно живется девочке в чужой семье, и только доставшаяся ей в наследство коровушка Рябушка помогает ей своей
      волшебной силой.
    en:
      It is difficult for the girl to live in a foreign family, and only the cow she inherited, Ryabushka, helps her with
      her magical powers.
    de:
      Es ist schwierig für das Mädchen, in einer fremden Familie zu leben, und nur die Kuh, die sie geerbt hat, Ryabushka,
      hilft ihr mit ihren magischen Kräften.
  directorsNote:
    ru: Есть на свете люди хорошие, есть и похуже, есть и такие, которые своего брата не стыдятся
    en: There are good people in this world, there are worse ones, and there are those who are not ashamed of their brother
    de: Es gibt gute Menschen auf der Welt, es gibt schlechtere, und es gibt solche, die sich ihres Bruders nicht schämen
