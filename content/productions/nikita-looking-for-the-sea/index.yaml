title:
  ru: Никита ищет море
  en: Nikita looking for the sea
  de: Nikita sucht das Meer
synopsis:
  ru: "История о семилетнем мальчике Никите, которого родители отправили в деревню
    к двоюродной бабушке на все лето. Но бабушка совсем не обычная!"
  en: "The story of a seven-year-old boy, Nikita, who is sent by his parents to
    the countryside to stay with his great-aunt for the whole summer. But the
    grandmother is not at all ordinary!"
  de: "Die Geschichte eines siebenjährigen Jungen namens Nikita, der von seinen
    Eltern auf das Land geschickt wird, um den ganzen Sommer über bei seiner
    Großtante zu bleiben. Aber die Großmutter ist überhaupt nicht gewöhnlich!"
directorsNote:
  ru: …со временем ты всё поймёшь. А пока — вымой посуду…
  en: …in time you will understand everything. But for now – wash the dishes…
  de: …mit der Zeit wirst du alles verstehen. Aber jetzt – spüle das Geschirr…
tagline:
  ru: Посвящается нашим бабушкам
  en: Dedicated to our grandmothers
  de: Unseren Großmüttern gewidmet
