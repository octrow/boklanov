synopsis:
  ru: Спектакль-концерт для солнценеспящих в двух действиях. Голос Егора Летова — символ распада великой державы — в исполнении молодого поколения БТК.
  en: "A concert-play for the sun-sleepless in two acts. Yegor Letov's voice — symbol of the collapse of a great power — performed by the young generation of BTK."
