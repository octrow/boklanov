title:
  ru: "Осторожно, злая собака!!!"
  en: "Beware of the Dog!"
  de: "Vorsicht, bösartiger Hund!!!"
synopsis:
  ru: "Джиму 12 лет и он стесняется своих детских увлечений. Его окружают
    проблемы: мама с нервами, одноклассники с интересами и новенький с угрозами.
    Как выжить в этом мире?"
  en: Jim, 12, plays with toys while his classmates chase girls. He hides his
    games from his mom and a bully. Can he see the world differently?
  de: "Jim ist 12 Jahre alt und schämt sich für seine kindlichen Hobbys. Er ist
    von Problemen umgeben: eine nervöse Mutter, Klassenkameraden mit ganz
    anderen Interessen und ein neuer Mitschüler, der ihm droht. Wie soll man in
    dieser Welt überleben?"
directorsNote:
  ru: "О Терье можно сказать много гадкого. Но одного у него не отнять: с папой
    ему достаётся не меньше, чем мне с мамой"
  en: "You could say a lot of nasty things about Terye. But there’s one thing you
    can’t deny: he gets just as much of a hard time from his dad as I do from my
    mom"
  de: "Man könnte viel Böses über Terje sagen. Aber eines kann man ihm nicht
    absprechen: Er bekommt vom Vater genauso viel Schwierigkeiten wie ich von
    der Mutter"
