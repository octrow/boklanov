title:
  ru: Снегурочка
  en: Snegurochka
  de: Snegurotschka
synopsis:
  ru: Спектакль по сказочной пьесе А.Н. Островского. Снегурочка — дочь Весны и
    Деда Мороза — живёт среди людей, но не может любить, ведь от любви она
    растает. Спектакль-лауреат «Золотой маски» 2017. Роман Бокланов — в роли
    Брусилы.
  en: "A performance based on A.N. Ostrovsky's fairy-tale play. The Snow Maiden —
    daughter of Spring and Father Frost — lives among people but cannot love,
    for love would melt her. Winner of the Golden Mask 2017. Roman Boklanov in
    the role of Brusilo."
  de: Eine Aufführung nach dem Märchenstück von A.N. Ostrowski. Das Schneeweißchen
    — Tochter von Frühling und Väterchen Frost — lebt unter Menschen, kann aber
    nicht lieben, denn Liebe würde sie schmelzen lassen. Gewinner der Goldenen
    Maske 2017. Roman Boklanov in der Rolle des Brusilo.
