title:
  ru: "Айяччо: история одного клоуна"
  en: Aiaccio
  de: "Aiaccio: Die Geschichte eines Clowns"
synopsis:
  ru: "Однажды в дружную цирковую семью приходит большая любовь, а вместе с ней и страх ее потери. Эта нежная история проникнет в самое сердце. И кто знает, возможно, она останется там навсегда!"
  en: "One day a big love comes to a friendly circus family, and with it the fear of losing it. This tender story will penetrate to the heart. And who knows, perhaps it will stay there forever!"
  de: "Eines Tages kommt große Liebe in eine freundliche Zirkusfamilie, und mit ihr die Angst, sie zu verlieren. Diese zarte Geschichte wird bis ins Herz dringen. Und wer weiß, vielleicht bleibt sie für immer dort!"
directorsNote:
  ru: Кто-то сомневался в существовании Джипси и Айяччо. А кто-то уверяет, что в тот вечер по морщинистой морде слонихи скатилась слеза — слеза счастья
  en: Some doubted the existence of Gypsy and Aiaccio. And some assure that on that evening a tear rolled down the wrinkled face of the elephant—a tear of happiness
  de: Einige zweifelten an der Existenz von Gypsy und Aiaccio. Und einige versichern, dass an jenem Abend eine Träne über das fältige Gesicht der Elefantenkuh rollte – eine Träne des Glücks
