title:
  ru: Полюс Амундсена
  en: "Amundsen's Pole"
  de: Amundsens Pol
synopsis:
  ru: Спектакль с элементами интерактива о жизненном пути первооткрывателя
    Антарктиды Руаля Амундсена — и о том, как в каждом из нас живёт способность
    действенно мечтать.
  en: An interactive performance about the life of Antarctic discoverer Roald
    Amundsen — and about the gift of purposeful dreaming that lives in each of
    us.
  de: Eine interaktive Aufführung über den Lebensweg des Antarktis-Entdeckers
    Roald Amundsen — und über die Gabe des zielgerichteten Träumens, die in
    jedem von uns lebt.
directorsNote:
  ru: "Личность Амундсена и история его открытий настолько по-человечески
    пронзительны и неоднозначны, что не важно, увлекаетесь ли вы географией или
    путаете Северный полюс с Южным. Я бы сказала, что наш спектакль об
    удивительном даре: способности действенно мечтать."
  en: "Amundsen's personality and the story of his discoveries are so humanly
    poignant and ambiguous that it doesn't matter whether you are passionate
    about geography or confuse the North Pole with the South. I would say that
    our show is about a remarkable gift: the ability to dream purposefully."
  de: "Amundsens Persönlichkeit und die Geschichte seiner Entdeckungen sind so
    menschlich ergreifend und vielschichtig, dass es keine Rolle spielt, ob Sie
    sich für Geografie begeistern oder den Nordpol mit dem Südpol verwechseln.
    Ich würde sagen, dass unser Stück von einer bemerkenswerten Gabe handelt:
    der Fähigkeit, zielgerichtet zu träumen."
