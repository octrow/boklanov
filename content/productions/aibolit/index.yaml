title:
  ru: Айболит
  en: Aibolit
  de: Aibolit
synopsis:
  ru: Патетическая оратория для хора работников медицинских учреждений. На сцене
    историю доктора Айболита поют доктора и медсёстры в белых халатах, а сцена
    превращается в дикие африканские джунгли.
  en: A pathetic oratorio for a choir of medical workers. On stage, the story of
    Doctor Aibolit is sung by doctors and nurses in white coats, while the stage
    transforms into wild African jungles.
  de: Eine pathetische Oratorien für einen Chor von Mitarbeitern medizinischer
    Einrichtungen. Auf der Bühne wird die Geschichte von Doktor Aibolit von
    Ärzten und Krankenschwestern in weißen Kitteln gesungen, während sich die
    Bühne in wilde afrikanische Dschungel verwandelt.
