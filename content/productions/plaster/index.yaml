title:
  ru: Гипс
  en: Plaster
  de: Gips
synopsis:
  ru: Это семейный спектакль о любви, которую боимся потерять, и о любви, которую
    ждём. Подростки, их родители, бабушки и дедушки – каждому придется пережить
    вместе с Фитц ужас от грядущего развода родителей, негодование, изумление,
    радость и влюбленность…
  en: "This is a family play! Teenagers, their parents, grandparents - everyone
    will experience with Fitz the horror of their parents' impending divorce,
    the indignation, the amazement, the joy and the falling in love…"
  de: "Dies ist ein Familienspiel! Jugendliche, ihre Eltern, Großeltern – jeder
    wird mit Fitz den Horror der bevorstehenden Scheidung der Eltern, die
    Empörung, die Verwunderung, die Freude und den Verliebtsein erleben…"
directorsNote:
  ru: …я поняла, о чём говорила моя мама. Вот каково это — быть кем-то ещё. И
    может, когда мне будет сорок два, я иногда буду скучать по этому дню
  en: "I understood what my mother was talking about. That's what it's like to be
    somebody else. And maybe when I'm forty-two, I'll miss this day sometimes."
  de: Ich verstand, wovon meine Mutter sprach. Das ist, wie es sich anfühlt,
    jemand anderen zu sein. Und vielleicht werde ich diesen Tag vermissen, wenn
    ich zweiundvierzig bin.
