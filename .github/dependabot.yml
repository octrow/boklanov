version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ['*']
        update-types: [minor, patch]
    # Majors (TypeScript 7, graphql 17, ...) break the Payload/Lexical peer ranges;
    # upgrade them by hand together with Payload.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
